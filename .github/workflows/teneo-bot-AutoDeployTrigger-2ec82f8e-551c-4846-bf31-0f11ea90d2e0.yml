name: Trigger auto deployment for teneo-bot

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ fixing_sections ]
    paths:
    - '**'
    - '.github/workflows/teneo-bot-AutoDeployTrigger-2ec82f8e-551c-4846-bf31-0f11ea90d2e0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TENEOBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TENEOBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TENEOBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: teneobot.azurecr.io
          registryUsername: ${{ secrets.TENEOBOT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TENEOBOT_REGISTRY_PASSWORD }}
          containerAppName: teneo-bot
          resourceGroup: teneo-lpvp
          imageToBuild: teneobot.azurecr.io/teneo-bot:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


